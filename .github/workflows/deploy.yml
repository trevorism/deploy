name: Deploy tested project to GCP

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, closed ]
  workflow_dispatch:

permissions: write-all

jobs:
  pipeline:
    uses: trevorism/actions-workflows/.github/workflows/pipeline.yml@master
    with:
      gcp_project: 'trevorism-project'
      gcp_project_id: '51970111147'
      version: '0-5-0'
    secrets: inherit
