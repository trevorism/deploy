name: Deploy tested project to GCP

on:
  push:
    branches: [ master ]
  # Opening/updating a PR deploys a hidden pr-<n> App Engine version and runs the
  # acceptance suite against it, so the PR can be tested before merge. Merge to
  # master deploys + promotes the release version. Purely additive to the standard
  # build -> deploy -> test composition.
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, closed ]
  workflow_dispatch:

permissions: write-all

# Cancel superseded PR runs; never cancel a master deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event.action != 'closed'
    uses: trevorism/actions-workflows/.github/workflows/build.yml@master
    with:
      JDK_VERSION: 25

  deploy:
    needs: [build]
    if: github.event.action != 'closed'
    uses: trevorism/actions-workflows/.github/workflows/deploy.yml@master
    with:
      JDK_VERSION: 25
      gcp_project: 'trevorism-project'
      gcp_project_id: '51970111147'
      # Master deploys the clean release version verbatim; PRs get a hidden pr-<n> env.
      version: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '0-5-0' }}
      promote: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  test:
    needs: [deploy]
    if: github.event.action != 'closed'
    uses: trevorism/actions-workflows/.github/workflows/accept.yml@master
    with:
      JDK_VERSION: 25
      # On PRs, test the hidden candidate URL; on master, empty -> the glue falls back to prod.
      base_url: ${{ github.event_name == 'pull_request' && needs.deploy.outputs.version_url || '' }}
    secrets: inherit

  cleanup-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    uses: trevorism/actions-workflows/.github/workflows/cleanup-pr.yml@master
    with:
      gcp_project: 'trevorism-project'
      gcp_project_id: '51970111147'
      version: ${{ format('pr-{0}', github.event.pull_request.number) }}
    secrets: inherit
